services:
  db:
    image: postgres:16-alpine
    container_name: vuepdf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vuepdf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # An S3-compatible object store, for developing and verifying the `s3` PDF
  # storage driver without an AWS or Cloudflare account (features/0016).
  #
  # **Nothing requires it.** `PDF_STORAGE_DRIVER` defaults to `local`, so the
  # application and every test suite run exactly as before with this container
  # stopped — which is deliberate: the suites must not need a network. Start it
  # only when working on the `s3` driver.
  #
  # Console at http://localhost:9001 (minioadmin / minioadmin). The bucket named
  # in `PDF_STORAGE_BUCKET` has to exist; `createbuckets` below makes it on
  # startup so the first run needs no clicking.
  minio:
    image: minio/minio:latest
    container_name: vuepdf-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # Private bucket, and it stays private: the PDFs are customer documents and
    # the only way to them is this API's signed, expiring URL. A public bucket
    # would hand out every document to anyone who guessed a key, undoing
    # features/0006 from the storage side.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/vuepdf-pdfs &&
      mc anonymous set none local/vuepdf-pdfs
      "

  # The job queue's Redis (features/0017).
  #
  # **Nothing requires it**, exactly like the MinIO above. `REDIS_URL` unset
  # means there is no queue and the PDF embed runs inline inside the request,
  # which is what the application does by default and what all three test suites
  # run on - they must not need a network. Start this only when working on the
  # queued path, and remember that the queued path also needs a worker process
  # (`npm run worker --workspace=backend`); with `REDIS_URL` set and no worker
  # running, jobs pile up and no PDF is ever rewritten.
  #
  # No volume on purpose: a queue of embed jobs is not durable state worth
  # keeping across a `docker compose down`. Every job is reconstructible - the
  # fields live in PostgreSQL, and re-saving the form queues another one.
  redis:
    image: redis:7-alpine
    container_name: vuepdf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
