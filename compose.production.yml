name: vuepdf

x-backend-environment: &backend-environment
  NODE_ENV: production
  PORT: "3000"
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  BASE_URL: ${BASE_URL:?BASE_URL is required}
  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
  ENABLE_HSTS: ${ENABLE_HSTS:-true}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PDF_STORAGE_DRIVER: ${PDF_STORAGE_DRIVER:-s3}
  PDF_STORAGE_BUCKET: ${PDF_STORAGE_BUCKET:?PDF_STORAGE_BUCKET is required}
  PDF_STORAGE_REGION: ${PDF_STORAGE_REGION:-auto}
  PDF_STORAGE_ENDPOINT: ${PDF_STORAGE_ENDPOINT:-}
  PDF_STORAGE_ACCESS_KEY_ID: ${PDF_STORAGE_ACCESS_KEY_ID:-}
  PDF_STORAGE_SECRET_ACCESS_KEY: ${PDF_STORAGE_SECRET_ACCESS_KEY:-}
  PDF_STORAGE_FORCE_PATH_STYLE: ${PDF_STORAGE_FORCE_PATH_STYLE:-false}
  PDF_STORAGE_PREFIX: ${PDF_STORAGE_PREFIX:-pdfs/}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required for the production worker}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-vuepdf}
  EMBED_WORKER_CONCURRENCY: ${EMBED_WORKER_CONCURRENCY:-5}
  EMBED_JOB_ATTEMPTS: ${EMBED_JOB_ATTEMPTS:-5}
  WEBHOOK_SIGNING_KEY: ${WEBHOOK_SIGNING_KEY:-}
  WEBHOOK_WORKER_CONCURRENCY: ${WEBHOOK_WORKER_CONCURRENCY:-5}
  WEBHOOK_JOB_ATTEMPTS: ${WEBHOOK_JOB_ATTEMPTS:-10}
  WEBHOOK_BACKOFF_MS: ${WEBHOOK_BACKOFF_MS:-10000}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
  STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}

services:
  migrate:
    image: vuepdf-backend:${IMAGE_TAG:-local}-migrations
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: migrations
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    restart: "no"

  worker:
    image: vuepdf-backend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runtime
    command: ["node", "dist/worker.js"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 2m

  api:
    image: vuepdf-backend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runtime
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 3

  web:
    image: vuepdf-frontend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"

