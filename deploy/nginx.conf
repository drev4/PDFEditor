server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The Alpine MIME table used by this image does not map `.mjs` on every
  # release. PDF.js loads its worker as an ES module; `nosniff` correctly
  # refuses application/octet-stream, so make the executable module type
  # explicit rather than weakening that security header.
  types {
    application/javascript mjs;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Complements the build-time meta policy; frame-ancestors only works in a header.
  add_header Content-Security-Policy "frame-ancestors 'none'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
